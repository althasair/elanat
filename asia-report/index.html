<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#F7F1E6,#EFE3CF);font-family:Tajawal,Tahoma,sans-serif;color:#2A1A20;padding:16px;box-sizing:border-box}
.box{background:#fff;border-radius:22px;box-shadow:0 18px 50px -20px rgba(98,16,42,.45);padding:30px 26px;max-width:420px;width:100%;text-align:center;border-top:6px solid #62102A}

.err{color:#B3261E;font-weight:700;min-height:22px;margin-top:10px;font-size:14px}small{display:block;margin-top:14px;color:#9A8C90}</style></head><body>
