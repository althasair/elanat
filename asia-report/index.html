<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#F7F1E6,#EFE3CF);font-family:Tajawal,Tahoma,sans-serif;color:#2A1A20;padding:16px;box-sizing:border-box}

async function op(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
